name: Deploy to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy (exact name, e.g. feature/docs-refactor)'
        required: true
      confirm_branch:
        description: 'Type the same branch again to confirm'
        required: true
      clean:
        description: 'Clean build?'
        type: choice
        options: ['false', 'true']
        default: 'false'

permissions:
  contents: write   # needed if your deploy step pushes to gh-pages (gh-pages or similar)

concurrency:
  group: pages-deploy-${{ github.event.inputs.branch }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Validate confirmation matches
        run: |
          if [ "${{ github.event.inputs.branch }}" != "${{ github.event.inputs.confirm_branch }}" ]; then
            echo "ERROR: branch and confirm_branch do not match."
            exit 1
          fi

      - name: Verify branch exists on origin
        run: |
          if ! git ls-remote --exit-code --heads https://github.com/${{ github.repository }} "${{ github.event.inputs.branch }}" >/dev/null; then
            echo "ERROR: Branch '${{ github.event.inputs.branch }}' not found on origin."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: |
          if [ "${{ github.event.inputs.clean }}" = "true" ]; then
            npm run clean || true
          fi
          npm run build

      - name: Deploy
        env:
          # If your deploy uses gh-pages or pushes to gh-pages, GITHUB_TOKEN is enough when permissions.contents: write
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run deploy