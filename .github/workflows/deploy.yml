name: Deploy to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      clean:
        description: 'Clean build?'
        type: choice
        options: ['false', 'true']
        default: 'false'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: |
          if [ "${{ github.event.inputs.clean }}" = "true" ]; then
            npm run clean || true
          fi
          npm run build
      - run: npm run deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}